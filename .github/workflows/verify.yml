# Copied to .github/workflows/verify.yml in the public time-tumble-play repo by `npm run deploy`.
# Every 10 minutes: are there ranked weekly runs waiting? If so, replay each one on the exact game
# version it was played on, and mark it verified (or rejected). Public repo = free Actions minutes.
# Needs one repository secret: VERIFIER_TOKEN (see the steps in the Time Tumble docs).
name: Verify weekly runs

on:
  schedule:
    - cron: '7,27,47 * * * *' # off the busy top-of-hour slots, which GitHub often drops
  workflow_dispatch:

concurrency:
  group: verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.52 can't install its browser's system parts on newer Ubuntu images
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # older game versions are git tags (v0.12.0, ...)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Anything waiting?
        id: check
        run: node verifier/verify.mjs --check
        env:
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
      - name: Install the headless browser
        if: steps.check.outputs.pending == 'yes'
        shell: bash
        run: |
          # Errors are echoed as annotations, which can be read without signing in to GitHub.
          if ! npm install --no-save --no-package-lock playwright@1.52.0 > npm.log 2>&1; then
            echo "::error title=npm install failed::$(tail -c 900 npm.log | tr '\n\r' '  ')"; exit 1
          fi
          # If Playwright's own Chromium can't be installed, verify.mjs falls back to the runner's Google Chrome.
          if ! npx playwright install --with-deps chromium > pw.log 2>&1; then
            echo "::warning title=Browser install::$(tail -c 900 pw.log | tr '\n\r' '  ')"
            npx playwright install chromium > pw2.log 2>&1 || echo "::warning title=Using runner Chrome::$(tail -c 400 pw2.log | tr '\n\r' '  ')"
          fi
      - name: Replay and give verdicts
        if: steps.check.outputs.pending == 'yes'
        shell: bash
        run: |
          set -o pipefail
          if ! node verifier/verify.mjs 2>&1 | tee verify.log; then
            echo "::error title=Verifier failed::$(tail -c 900 verify.log | tr '\n\r' '  ')"; exit 1
          fi
        env:
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
