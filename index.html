<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Time Tumble" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Time Tumble</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0820; overflow: hidden; touch-action: none; overscroll-behavior: none; position: fixed; width: 100%;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #0b0820; color: #fff; font: bold 26px "Trebuchet MS", Arial, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
      #rotate .phone { width: 46px; height: 78px; border: 4px solid #7ff9ff; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #iosnudge { position: fixed; inset: 0; z-index: 19; background: rgba(5,1,13,.88); display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); font-family: "Trebuchet MS", Arial, sans-serif; color: #fff; }
      #iosnudge .card { background: #1c1238; border: 3px solid #e8b44a; border-radius: 18px; padding: 14px 22px; max-width: 560px; width: calc(100% - 40px); max-height: calc(100% - 20px); overflow: auto; box-sizing: border-box; text-align: center; }
      #iosnudge .t { font: bold 26px "Trebuchet MS", Arial, sans-serif; color: #ffe066; margin-bottom: 4px; }
      #iosnudge .s { font-size: 14px; color: #c8f8ff; margin: 4px 0; }
      #iosnudge ol { text-align: left; font-size: 17px; line-height: 1.6; margin: 6px 0; padding-left: 26px; }
      #iosnudge .h { font-size: 13px; opacity: .8; }
      #iosnudge button { margin-top: 8px; font: bold 16px "Trebuchet MS", Arial, sans-serif; color: #1c1238; background: #ffe066; border: 0; border-radius: 999px; padding: 10px 22px; }
      #loading { position: fixed; inset: 0; z-index: 18; background: radial-gradient(ellipse at 50% 40%, #2a1650 0%, #0b0820 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: "Trebuchet MS", Arial, sans-serif; color: #fff; transition: opacity .45s ease; }
      #loading.gone { opacity: 0; pointer-events: none; }
      #loading .ttl { font: bold 46px "Trebuchet MS", Arial, sans-serif; letter-spacing: 3px; color: #ffe066; text-shadow: 0 3px 0 #7a3d10, 0 0 24px rgba(255,200,80,.45); }
      #loading .thread { position: relative; width: min(420px, 70vw); height: 34px; }
      #loading .thread svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #loading .thread path { fill: none; stroke: #ffd24a; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px #ffb020); stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2.2s ease-in-out infinite; }
      #loading .shard { position: absolute; top: 50%; left: 4%; width: 18px; height: 26px; margin: -13px 0 0 -9px; background: linear-gradient(160deg, #e9fdff, #7ff9ff 45%, #2a8fd6); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); filter: drop-shadow(0 0 8px #7ff9ff); transition: left .3s ease; }
      #loading .bar { width: min(420px, 70vw); height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 4%; border-radius: 99px; background: linear-gradient(90deg, #ffb020, #ffe066); transition: width .3s ease; }
      #loading .msg { font-size: 15px; color: #c8f8ff; opacity: .85; min-height: 18px; }
      @keyframes draw { 0% { stroke-dashoffset: 600; } 60%, 100% { stroke-dashoffset: 0; } }
    </style>
    <script type="module" crossorigin src="./assets/index-ClfO-jyn.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading"><div class="ttl">TIME TUMBLE</div><div class="thread"><svg viewBox="0 0 420 34" preserveAspectRatio="none"><path d="M0 17 C 70 2, 140 32, 210 17 S 350 2, 420 17"/></svg><div class="shard"></div></div><div class="bar"><i></i></div><div class="msg">Loading…</div></div>
    <div id="rotate"><div class="phone"></div><span>Turn your phone sideways to play</span><span style="font-size:16px;font-weight:normal;opacity:.8">Time Tumble is a landscape game</span></div>
  </body>
</html>
